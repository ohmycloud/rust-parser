[package]
name = "recipe-web"
version.workspace = true
edition.workspace = true
description.workspace = true
keywords.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true

[dependencies]
recipe-lang = { path = "../recipe-lang" }
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
gloo-events = "0.2"
web-sys = { version = "0.3", features = [
    "Clipboard", "HtmlDialogElement", "HtmlElement", "HtmlSelectElement",
    "HtmlTextAreaElement", "Location", "Navigator", "Storage", "Window",
    "Document", "DomRect", "Element", "EventTarget", "KeyboardEvent", "PointerEvent",
] }
